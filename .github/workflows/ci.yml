name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release

  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p orderer-disruptor --test loom --release
        env:
          RUSTFLAGS: --cfg loom

  vendored:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: abhijitkrm/orderer
          path: upstream/orderer
          token: ${{ secrets.ORDERER_REPO_TOKEN || github.token }}
          fetch-depth: 0
      - run: UPSTREAM_DIR=upstream/orderer scripts/vendored.sh

  # Down-axis differential fuzzing (spec repo scripts) against matcher-rust
  # at the commit orderer-core was ported from (docs/VENDORED.md).
  diffuzz:
    runs-on: ubuntu-latest
    env:
      ORDERER_RUST_DIR: ${{ github.workspace }}
      MATCHER_RUST_DIR: ${{ github.workspace }}/upstream/matcher-rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: abhijitkrm/orderer
          path: upstream/orderer
          token: ${{ secrets.ORDERER_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: abhijitkrm/matcher-rust
          ref: 8c4d05ec0474ee3517ad83e017ff7372f4ea7e3d
          path: upstream/matcher-rust
      - uses: dtolnay/rust-toolchain@stable
      - run: upstream/orderer/scripts/diffuzz.sh 4 10000
      - run: upstream/orderer/scripts/e2e.sh
