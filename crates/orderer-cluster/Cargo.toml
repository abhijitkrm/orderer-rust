[package]
name = "orderer-cluster"
description = "Replicated orderer: durable WAL, snapshots, TCP transport and node runtime around the orderer-consensus protocol core"
keywords = ["raft", "replication", "matching-engine", "exchange", "failover"]
categories = ["concurrency", "network-programming"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
orderer = { path = "../orderer", version = "0.2.1", features = ["hwcrc"] }
orderer-core = { path = "../orderer-core", version = "0.2.1" }
orderer-consensus = { path = "../orderer-consensus", version = "0.2.1" }
