[package]
name = "orderer-exchange"
description = "The matching tier of the orderer exchange: a replicated matching group that takes ledger-forwarded orders exactly once and serves its settlement event stream"
keywords = ["exchange", "matching-engine", "raft", "state-machine"]
categories = ["finance"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
orderer = { path = "../orderer", version = "0.2.1", features = ["hwcrc"] }
orderer-core = { path = "../orderer-core", version = "0.2.1" }
orderer-consensus = { path = "../orderer-consensus", version = "0.2.1" }
orderer-cluster = { path = "../orderer-cluster", version = "0.2.1" }
orderer-ledger = { path = "../orderer-ledger", version = "0.2.1" }
